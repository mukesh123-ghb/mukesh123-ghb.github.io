name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AE2E32: ${{ secrets.AE2E32 }}
          B130E4: ${{ secrets.B130E4 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AE2E32', '')
          bm = os.environ.get('B130E4', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 3c2e141fd4d2104702d2a5c2fc2f07 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 7662abedef868dbabe24a377 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
