
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sam's Journal</title>

  <style>
    :root {
      --cream: #F5F0E5;
      --brown: #493528;
      --pink: #E8A9B5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--brown);
      font-family: Georgia, serif;
    }

    /* NAVIGATION BAR */

    nav {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 85px;
      background: var(--cream);

      display: grid;
      grid-template-columns:
        1fr 1.2fr 1fr 1.3fr 1fr 65px;

      align-items: center;
      gap: 12px;
      padding: 12px 35px;
    }

    nav a {
      color: var(--brown);
      text-decoration: none;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
      line-height: 1.5;
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.6;
    }

    /* PLUMERIA HOME / ABOUT BUTTON */

    .flower-link {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 50px;
      height: 50px;
      justify-self: center;

      transition: transform 0.3s ease;
    }

    .flower-link:hover {
      transform: rotate(15deg) scale(1.1);
      opacity: 1;
    }

    .flower-link svg {
      width: 43px;
      height: 43px;
    }

    /* FULL-SCREEN HOMEPAGE PHOTO */

    .hero {
      min-height: calc(100vh - 85px);

      background:
        linear-gradient(
          rgba(0,0,0,0.08),
          rgba(0,0,0,0.18)
        ),
        url("images/homepage.JPG");
      background-size: cover;
      background-position: center top;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 100px 30px;
      text-align: center;
    }

    /* TEXT OVER PHOTOGRAPH */

    .hero h1 {
      color: var(--cream);
      font-size: clamp(32px, 5vw, 70px);
      font-weight: normal;
      font-style: italic;
      line-height: 1.3;
      max-width: 800px;
      margin: 0;
    }

    /* CREAM ABOUT SECTION */

   
/* ABOUT SECTION */

.about {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 650px;
  background: var(--cream);
}

.about-photo {
  width: 100%;
  height: 100%;
  min-height: 650px;
  object-fit: cover;
  display: block;
}

.about-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding: 70px 12%;
  color: var(--brown);
}

.about-text h2 {
  font-size: clamp(30px, 3vw, 48px);
  font-weight: normal;
  font-style: italic;
  margin: 0 0 25px;
}

.about-text p {
  font-size: 17px;
  line-height: 1.9;
  margin: 0 0 20px;
}

/* PHONE LAYOUT */

@media (max-width: 700px) {
  .about {
    grid-template-columns: 1fr;
  }

  .about-photo {
    height: 420px;
    min-height: 0;
  }

  .about-text {
    padding: 60px 30px;
  }

  .about-text h2 {
    font-size: 32px;
  }

  .about-text p {
    font-size: 16px;
  }
}


    /* MOBILE DESIGN */

    @media (max-width: 700px) {

      nav {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        padding: 15px 10px;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 0.5px;
      }

      .flower-link {
        width: 42px;
        height: 42px;
      }

      .flower-link svg {
        width: 38px;
        height: 38px;
      }

      .hero {
        min-height: 85vh;
      }

      .hero h1 {
        font-size: 36px;
      }

      .about h2 {
        font-size: 27px;
      }

      .about p {
        font-size: 18px;
      }
    }
  </style>
</head>
